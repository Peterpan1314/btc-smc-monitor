name: BTC SMC Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --quiet requests
      - name: Run monitor
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_EMAIL_PASSWORD: ${{ secrets.QQ_EMAIL_PASSWORD }}
          QQ_EMAIL_TO: ${{ secrets.QQ_EMAIL_TO }}
          COOLDOWN_SEC: ${{ secrets.COOLDOWN_SEC }}
          MIN_PCT_CHANGE: ${{ secrets.MIN_PCT_CHANGE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python python.py
